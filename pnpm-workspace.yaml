allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - workerd

overrides:
  nanoid: '3.3.18'
  minimatch: '10.2.3'
  brace-expansion: '^5.0.12'
  rollup: '4.59.0'
  undici: '7.29.1'
  tmp: '0.2.7'
  lodash: '4.18.1'
  yaml: '2.8.3'
  uuid: '11.1.1'
  qs: '6.15.3'
  '@opentelemetry/core': '2.8.0'
  body-parser: '1.20.6'
  # Keep transitive parsers and merge helpers on patched releases.
  fast-uri: '^3.1.8'
  ip-address: '^10.7.4'
  compression: '^1.8.2'
  proxy-addr: '^2.0.8'
  smol-toml: '^1.9.1'
  # Typography pins vulnerable parser 6.x; retain its API with patched 7.x.
  '@tailwindcss/typography>postcss-selector-parser': '^7.1.6'
  # argparse 2 preserves the legacy CLI API and removes unpatched sprintf-js.
  'js-yaml@^3>argparse': '^2.0.1'
  deepmerge-ts: '8.0.0'
  # LHCI 0.15.1 pins Lighthouse 12, which pulls unpatched extract-zip.
  # Lighthouse 13 is already a direct project dependency and removes that path.
  '@lhci/cli>lighthouse': '13.4.1'
  '@lhci/utils>lighthouse': '13.4.1'
  '@lhci/cli>proxy-agent': '8.0.2'
  sharp: '0.35.5'
  source-map-js: '1.2.2'
  svgo: '4.1.0'
  # js-yaml DoS via unbounded merge-key CPU (GHSA alerts 189/190)
  'js-yaml@^3': '3.15.2'
  'js-yaml@^4': '4.3.2'
  # Keep the transitive PostCSS advisory out of all toolchain paths.
  postcss: '8.5.25'
  # Vite 8 + picomatch 4 interop can throw parse.fastpaths; pin patched 2.x (GHSA-c2c7-rcm5-vvqj)
  picomatch: '2.3.2'
  # GHSA-ch52-4w7c-c8xp: astro pulls http-cache-semantics@4.2.0; 4.3.0 contains the fix.
  http-cache-semantics: '4.3.0'

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'
    tailwindcss: 4.3.1
