allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - workerd

overrides:
  nanoid: '3.3.18'
  minimatch: '10.2.3'
  brace-expansion: '>=5.0.8'
  rollup: '4.59.0'
  undici: '7.28.0'
  tmp: '0.2.7'
  lodash: '4.18.1'
  yaml: '2.8.3'
  uuid: '11.1.1'
  qs: '6.15.3'
  '@opentelemetry/core': '2.8.0'
  body-parser: '1.20.6'
  fast-uri: '3.1.4'
  sharp: '0.35.3'
  svgo: '4.0.2'
  # Keep the transitive PostCSS advisory out of all toolchain paths.
  postcss: '8.5.25'
  # Vite 8 + picomatch 4 interop can throw parse.fastpaths; pin patched 2.x (GHSA-c2c7-rcm5-vvqj)
  picomatch: '2.3.2'

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'
    tailwindcss: 4.3.1
