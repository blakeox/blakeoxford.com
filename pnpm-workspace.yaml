allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - workerd

overrides:
  minimatch: '10.2.3'
  brace-expansion: '5.0.7'
  rollup: '4.59.0'
  undici: '7.28.0'
  tmp: '0.2.7'
  lodash: '4.18.1'
  yaml: '2.8.3'
  uuid: '11.1.1'
  qs: '6.15.3'
  '@opentelemetry/core': '2.8.0'
  # Vite 8 + picomatch 4 interop can throw parse.fastpaths; pin 2.x for tooling stability
  picomatch: '2.3.1'

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'
    tailwindcss: 4.3.1
