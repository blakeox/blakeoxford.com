allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  puppeteer: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - '@tailwindcss/oxide'
  - esbuild
  - puppeteer
  - sharp
  - workerd

overrides:
  minimatch: "10.2.3"
  rollup: "4.59.0"
  undici: "7.28.0"
  tmp: "0.2.7"
  lodash: "4.18.1"
  yaml: "2.8.3"
  uuid: "11.1.1"
  qs: "6.15.3"

peerDependencyRules:
  allowedVersions:
    tailwindcss: 4.3.1
