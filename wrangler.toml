name = "blakeoxford-com"
account_id = "cc3bb24ae3c87cff38c2be85df3dab29"
compatibility_date = "2026-09-25"

# Enable Node.js compatibility for dependencies that rely on Node built-ins (e.g., @sentry/cloudflare)
compatibility_flags = ["nodejs_compat"]

# Switch to Workers: serve static assets from ./dist via an assets binding,
# and use a single Worker entry (functions/index.ts).
main = "functions/index.ts"
workers_dev = false
# Production stays off workers.dev. Branch previews still need a public URL.
preview_urls = true

# Low-frequency canary for the public AI Search route. Remove this block and
# redeploy to disable the scheduled check without affecting request traffic.
[triggers]
crons = ["0 */6 * * *"]

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true


[[routes]]
pattern = "blakeoxford.com/*"
zone_name = "blakeoxford.com"

[[routes]]
pattern = "www.blakeoxford.com/*"
zone_name = "blakeoxford.com"



[[kv_namespaces]]
# Each binding has its own physical namespace so eviction and growth stay isolated.
binding = "RATE_LIMIT_KV"
id      = "28bd20259b60413f8ae8fc1cfd85218e"

[[kv_namespaces]]
binding = "CONTACT_MESSAGES"
id      = "2e073b87d4e54f578872ea8f0810ac33"

[[kv_namespaces]]
binding = "AI_RESPONSE_CACHE"
id      = "88ac13a34f474753bd44450267bd2206"

[[kv_namespaces]]
binding = "AI_FEEDBACK_KV"
id      = "eb24b6927f49428e8f386d7660f021f9"

# Contact form delivery is restricted to this sender and verified destination.
[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "blakepoxford@outlook.com"
allowed_sender_addresses = ["noreply@blakeoxford.com"]

# Durable Objects for real-time conversation state
[[durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDurableObject"
script_name = "blakeoxford-com"

# Sentry Configuration
# Set these secrets via: wrangler secret put <NAME>
# SENTRY_DSN_EDGE       - DSN for edge function errors (from Sentry dashboard)
# SENTRY_AUTH_TOKEN     - Auth token for source map uploads (optional)
# GIT_COMMIT            - Current git commit SHA (set in CI/CD)
# ENVIRONMENT           - Deployment environment (production/staging)

[secrets]
# Keep the required declaration aligned with the deployed secret name.
required = ["TURNSTILE_SECRET_KEY"]

[vars]
# Public variables (not sensitive)
# Add ENVIRONMENT variable for Sentry context
ENVIRONMENT = "production"
# One-release rollback target for the previous Worker version. Production Ask
# uses the AI_SEARCH binding below. Roll back by deploying the previous Worker
# version; do not point this URL at the retired AutoRAG API.
AI_SEARCH_API_ENDPOINT = "https://api.cloudflare.com/client/v4/accounts/cc3bb24ae3c87cff38c2be85df3dab29/ai-search/instances/bold-heart-18e4/chat/completions"
PUBLIC_CLARITY_PROJECT_ID = "tqngpokfgs"

# AI Gateway for Workers AI (`env.AI.run` in workers-ai.ts).
# `default` auto-creates an account gateway on first authenticated request.
# Do NOT route AutoRAG/AI Search indexing through a caching gateway.
# Docs: https://developers.cloudflare.com/ai-gateway/integrations/aig-workers-ai-binding/
AI_GATEWAY_ID = "default"
# AI_GATEWAY_ACCOUNT_ID unused by the Workers AI binding path (kept for ops notes).
# AI_GATEWAY_ACCOUNT_ID = "cc3bb24ae3c87cff38c2be85df3dab29"

[[analytics_engine_datasets]]
binding = "AI_ANALYTICS"

# Workers AI for on-edge inference (simple queries)
[ai]
binding = "AI"

# Direct instance binding. Scoped so this Worker cannot create or delete instances.
[[ai_search]]
binding = "AI_SEARCH"
instance_name = "bold-heart-18e4"
remote = true

# Vectorize for semantic search fallback
[[vectorize]]
binding = "VECTORIZE"
index_name = "blakeoxford-content"

# Durable Objects migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationDurableObject"]

[observability.logs]
enabled = true

# Low-volume request traces for production diagnosis. Workers Paid includes a
# monthly event allowance; keep sampling bounded and review usage before raising it.
[observability.traces]
enabled = true
head_sampling_rate = 0.05

# Worker Previews do not inherit production bindings. KV and email stay off the
# production resources. Vectorize and AI Search stay shared because those paths
# only read published content. Durable Objects are isolated per preview.
# Set TURNSTILE_SECRET_KEY once with:
#   wrangler preview base-config secret put TURNSTILE_SECRET_KEY
[previews.vars]
ENVIRONMENT = "preview"
AI_GATEWAY_ID = "default"
PUBLIC_CLARITY_PROJECT_ID = "tqngpokfgs"
AI_SEARCH_API_ENDPOINT = "https://api.cloudflare.com/client/v4/accounts/cc3bb24ae3c87cff38c2be85df3dab29/ai-search/instances/bold-heart-18e4/chat/completions"

[previews.ai]
binding = "AI"

[[previews.ai_search]]
binding = "AI_SEARCH"
instance_name = "bold-heart-18e4"
remote = true

[[previews.vectorize]]
binding = "VECTORIZE"
index_name = "blakeoxford-content"

[[previews.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b1e48f3c6ef64010b435082d04435536"

[[previews.kv_namespaces]]
binding = "CONTACT_MESSAGES"
id = "728c2829569b4cfb8f926824a0c8d59f"

[[previews.kv_namespaces]]
binding = "AI_RESPONSE_CACHE"
id = "f48c68af7f21462e8a68f84418a64498"

[[previews.kv_namespaces]]
binding = "AI_FEEDBACK_KV"
id = "e573df95437742e9820c05eef1bd8ad6"

[[previews.durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDurableObject"
script_name = "blakeoxford-com"

[previews.observability.logs]
enabled = true

[previews.observability.traces]
enabled = true
head_sampling_rate = 1
