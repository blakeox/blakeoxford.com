name = "blakeoxford-com"
account_id = "cc3bb24ae3c87cff38c2be85df3dab29"
compatibility_date = "2026-07-02"

# Enable Node.js compatibility for dependencies that rely on Node built-ins (e.g., @sentry/cloudflare)
compatibility_flags = ["nodejs_compat"]

# Switch to Workers: serve static assets from ./dist via an assets binding,
# and use a single Worker entry (functions/index.ts).
main = "functions/index.ts"

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true


[[routes]]
pattern = "blakeoxford.com/*"
zone_name = "blakeoxford.com"

[[routes]]
pattern = "www.blakeoxford.com/*"
zone_name = "blakeoxford.com"



[[kv_namespaces]]
# Shared physical namespace for cost efficiency. Keep key prefixes disjoint:
#   ratelimit:*  → RATE_LIMIT_KV
#   msg:*        → CONTACT_MESSAGES
#   ai:response:* → AI_RESPONSE_CACHE
#   feedback:*   → AI_FEEDBACK_KV
# Split into separate KV namespaces before these datasets compete for eviction.
binding = "RATE_LIMIT_KV"
id      = "65439bda285f486f9b07fc2a30bc5099"

[[kv_namespaces]]
binding = "CONTACT_MESSAGES"
id      = "65439bda285f486f9b07fc2a30bc5099"

[[kv_namespaces]]
binding = "AI_RESPONSE_CACHE"
id      = "65439bda285f486f9b07fc2a30bc5099"

[[kv_namespaces]]
binding = "AI_FEEDBACK_KV"
id      = "65439bda285f486f9b07fc2a30bc5099"

# Contact form delivery is restricted to this sender and verified destination.
[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "blakepoxford@outlook.com"
allowed_sender_addresses = ["noreply@blakeoxford.com"]

# Durable Objects for real-time conversation state
[[durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDurableObject"
script_name = "blakeoxford-com"

# Sentry Configuration
# Set these secrets via: wrangler secret put <NAME>
# SENTRY_DSN_EDGE       - DSN for edge function errors (from Sentry dashboard)
# SENTRY_AUTH_TOKEN     - Auth token for source map uploads (optional)
# GIT_COMMIT            - Current git commit SHA (set in CI/CD)
# ENVIRONMENT           - Deployment environment (production/staging)

[vars]
# Public variables (not sensitive)
# Add ENVIRONMENT variable for Sentry context
# ENVIRONMENT = "production"
AI_SEARCH_API_ENDPOINT = "https://api.cloudflare.com/client/v4/accounts/cc3bb24ae3c87cff38c2be85df3dab29/autorag/rags/bold-heart-18e4/ai-search"
PUBLIC_CLARITY_PROJECT_ID = "tqngpokfgs"

# Optional AI Gateway for Workers AI only (`env.AI.run` in workers-ai.ts).
# Uncomment after the gateway exists (or use id = "default" to auto-create).
# Do NOT point AutoRAG/AI Search indexing through a caching gateway.
# Docs: https://developers.cloudflare.com/ai-gateway/integrations/aig-workers-ai-binding/
# AI_GATEWAY_ID = "blakeoxford-ai-gateway"
# AI_GATEWAY_ACCOUNT_ID is unused by the Workers AI binding path (kept for docs/ops).
# AI_GATEWAY_ACCOUNT_ID = "cc3bb24ae3c87cff38c2be85df3dab29"

# Note: PUBLIC_CF_WEB_ANALYTICS_TOKEN is an Astro build-time public env (CI),
# not a Worker [vars] binding. Pass it in the Deploy Worker workflow build step.

[[analytics_engine_datasets]]
binding = "AI_ANALYTICS"

# Workers AI for on-edge inference (simple queries)
[ai]
binding = "AI"

# Vectorize for semantic search fallback
[[vectorize]]
binding = "VECTORIZE"
index_name = "blakeoxford-content"

# Durable Objects migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationDurableObject"]

[observability.logs]
enabled = true
