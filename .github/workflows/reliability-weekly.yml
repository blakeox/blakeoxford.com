name: Weekly Cross-Browser Reliability

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  PATH: /home/github-runner/.local/node-v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  essential-reliability:
    name: Essential + device matrix
    runs-on: [self-hosted, nuc, seo]
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --user 1001:1001
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm build
      - name: Verify Playwright
        run: pnpm exec playwright --version
      - name: Run essential tests (Chromium)
        run: npx playwright test --grep "@essential" --project=chromium --reporter=line,json --output=test-results/chromium
      - name: Run extended device matrix (Chromium)
        run: pnpm run test:e2e:device-matrix
      - name: Run essential tests (Firefox)
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test --grep "@essential" --project=firefox --reporter=line,json --output=test-results/firefox
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: weekly-essential-artifacts
          path: |
            playwright-report
            test-results
      - name: Post flakiness tracking
        run: |
          export PW_JSON_REPORT=playwright-report/test-results.json || true
          node scripts/quality/flakiness-tracker.js || true
      - name: Generate quality summary
        run: pnpm quality:summary || true
      - name: Upload quality summary
        uses: actions/upload-artifact@v7
        with:
          name: quality-summary
          path: quality-summary.md

  extended-reliability:
    name: Extended suite (Chromium)
    runs-on: [self-hosted, nuc, seo]
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --user 1001:1001
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm build
      - name: Verify Playwright
        run: pnpm exec playwright --version
      - name: Run extended tests (Chromium)
        run: pnpm run test:e2e:extended:chromium
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-extended-artifacts
          path: |
            playwright-report
            test-results
