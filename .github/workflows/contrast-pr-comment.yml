name: Contrast PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PATH: /home/github-runner/.local/node-v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  contrast-run:
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-contrast')
    runs-on: [self-hosted, nuc, seo]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --user 1001:1001 --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node and pnpm
        uses: ./.github/actions/nuc-node-pnpm
        with:
          node-version: '24'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run contrast test (json emission)
        run: pnpm contrast:history || true
        env:
          CONTRAST_ALERT_THRESHOLD: 9999
          CONTRAST_JSON: 1
      - name: Generate markdown report (7 days)
        run: pnpm contrast:report -- --markdown --limit 7 > pr-contrast.md 2>&1 || true
      - name: Upload contrast PR artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrast-pr-artifacts
          path: |
            quality-snapshots/contrast-history.json
            pr-contrast.md
          if-no-files-found: ignore

  contrast-comment:
    name: contrast-pr
    needs: contrast-run
    if: |
      always() &&
      needs.contrast-run.result != 'cancelled' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-contrast')
    runs-on: [self-hosted, nuc, seo]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download contrast artifacts
        uses: actions/download-artifact@v8
        with:
          name: contrast-pr-artifacts
          path: .
        continue-on-error: true
      - name: Build PR comment body
        run: |
          {
            echo '### Accessibility Contrast Summary'
            echo ''
            if [ -f quality-snapshots/contrast-history.json ]; then
              latest=$(jq -r 'last' quality-snapshots/contrast-history.json 2>/dev/null || true)
              slope=$(echo "$latest" | jq -r '.metrics.slope7Borderline // empty')
              if [ -n "$slope" ]; then
                awkTrend=$(node -e "import { classifyTrend } from './scripts/quality/lib/contrastMetrics.js'; console.log(classifyTrend($slope));" 2>/dev/null || true)
                arrow="⭮"
                if [ "$awkTrend" = "worsening" ]; then arrow="▲"; fi
                if [ "$awkTrend" = "improving" ]; then arrow="▼"; fi
                echo "Latest trend: $awkTrend ($slope) $arrow"
                echo ''
              fi
            fi
            if [ -f pr-contrast.md ] && ! grep -q 'ELIFECYCLE' pr-contrast.md; then
              echo 'Last 7 days (including this run):'
              sed 's/^/| /' pr-contrast.md | sed '1s/^| //'
            else
              echo '_No contrast history available yet._'
            fi
            echo ''
            echo '> This PR run emits sampled borderline contrast stats for awareness. Nightly workflow enforces alerts.'
            echo ''
            echo '<!-- contrast-pr-summary-marker -->'
          } > pr-comment-body.txt
      - name: Create or update comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- contrast-pr-summary-marker -->';
            const body = fs.readFileSync('pr-comment-body.txt', 'utf8');
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
