name: Design Token Docs Sync

on:
  pull_request:
    paths:
      - 'src/styles/theme.css'
      - 'src/pages/design/tokens.astro'

permissions:
  contents: read

concurrency:
  group: nuc-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


env:
  PATH: /home/github-runner/.local/node-v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  theme-docs-sync:
    name: Verify token docs sync
    runs-on: [self-hosted, nuc, seo]
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify theme.css changes include token docs
        run: node scripts/quality/check-theme-docs-sync.js
        env:
          BASE_REF: origin/${{ github.base_ref }}
