name: Design Token Docs Sync

on:
  pull_request:
    paths:
      - 'src/styles/theme.css'
      - 'src/pages/design/tokens.astro'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true



jobs:
  theme-docs-sync:
    name: Verify token docs sync
    runs-on: ubuntu-latest
    if: |
      github.actor != 'dependabot[bot]' &&
      (
        ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') &&
          (github.actor == github.repository_owner ||
            contains(fromJSON('["github-actions[bot]","cursor[bot]"]'), github.actor)))
      )
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify theme.css changes include token docs
        run: node scripts/quality/check-theme-docs-sync.js
        env:
          BASE_REF: origin/${{ github.base_ref }}
