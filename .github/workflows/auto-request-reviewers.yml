name: Auto Request Reviewers

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true



jobs:
  request:
    # Never execute pull_request_target automation for fork PRs on the self-hosted NUC.
    if: |
      github.actor != 'dependabot[bot]' &&
      (
        ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') &&
          (github.actor == github.repository_owner ||
            contains(fromJSON('["github-actions[bot]","cursor[bot]"]'), github.actor)))
      )
    runs-on: [self-hosted, nuc, seo]
    steps:
      - name: Auto-request reviewers from CODEOWNERS
        uses: necojackarc/auto-request-review@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/auto-request-review.yml
