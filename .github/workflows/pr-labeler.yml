name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: nuc-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  label:
    # Never execute pull_request_target automation for fork PRs on the self-hosted NUC.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nuc, seo]
    steps:
      - name: Apply labels based on changed files
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
