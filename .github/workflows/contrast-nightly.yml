name: Contrast Nightly

on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true



env:
  PATH: /home/github-runner/.local/node-v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  contrast:
    if: |
      github.actor != 'dependabot[bot]' &&
      (
        ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') &&
          (github.actor == github.repository_owner ||
            contains(fromJSON('["github-actions[bot]","cursor[bot]"]'), github.actor)))
      )
    runs-on: [self-hosted, nuc, seo]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --user 1001:1001 --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          dest: ${{ runner.temp }}/pnpm-tooling
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Select extra contrast routes
        id: rotate
        run: |
          EXTRA=$(node scripts/quality/contrast-route-rotator.js --projects 3 --blogs 2)
          echo "extra_routes=$EXTRA" >> $GITHUB_OUTPUT
          echo "Selected extra routes: $EXTRA"
      - name: Run contrast history (resilient)
        id: history
        run: |
          set +e
          pnpm contrast:history | tee contrast_history.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e
        env:
          CONTRAST_ALERT_THRESHOLD: 3
          CONTRAST_EXTRA_ROUTES: ${{ steps.rotate.outputs.extra_routes }}
      - name: Generate badge
        run: pnpm contrast:badge
      - name: Generate markdown report
        run: pnpm contrast:report -- --markdown --limit 14 > contrast-report.md || true
      - name: Alert check
        id: alert
        run: pnpm contrast:check | tee contrast_alert.log
      - name: Parse alert output & markdown snippet
        id: parse
        run: |
          issue=$(grep '^CONTRAST_ISSUE::' contrast_alert.log || true)
          snippet=$(grep -A20 '^\[contrast-alert-markdown\]' contrast_history.log || true)
          if [ -n "$issue" ]; then
            body=${issue#CONTRAST_ISSUE::}
            if [ -n "$snippet" ]; then
              body="$body\n\n## Recent Contrast Trend (last up to 3 days)\n$(echo "$snippet" | sed '1d')"
            fi
            echo "issue_body<<EOF" >> $GITHUB_OUTPUT
            echo "$body" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      - name: Write combined issue body
        if: steps.parse.outputs.issue_body
        run: |
          echo "${{ steps.parse.outputs.issue_body }}" > contrast_issue_body.md
      - name: Create issue if needed
        if: steps.parse.outputs.issue_body
        uses: peter-evans/create-issue-from-file@v6
        with:
            title: 'Contrast borderline threshold exceeded'
            content-filepath: contrast_issue_body.md
            labels: a11y, contrast
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contrast-assets
          path: |
            quality-snapshots/contrast-history.json
            badges/contrast.svg
            contrast-report.md
            contrast_history.log
            contrast_alert.log
