name: Security & Dependency Scan

on:
  push:
    branches: [ main, development, testing ]
  pull_request:
    branches: [ main, development, testing ]
  schedule:
    # Run security scans weekly
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security & Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run pnpm audit
        run: |
          echo "🔒 Running pnpm security audit (prod)..."
          pnpm audit --audit-level=moderate --prod || echo "⚠️ Security vulnerabilities found"

      - name: Check for secrets in code
        run: |
          echo "🕵️ Scanning for exposed secrets..."
          # Basic patterns to avoid committing secrets
          SECRETS_FOUND=0

          # Check for common secret patterns
          if grep -r "AKIA[0-9A-Z]{16}" . --exclude-dir=.git || \
             grep -r "ghp_[a-zA-Z0-9]{36}" . --exclude-dir=.git || \
             grep -r "sk-[a-zA-Z0-9]{48}" . --exclude-dir=.git; then
            SECRETS_FOUND=1
          fi

          if [ $SECRETS_FOUND -eq 1 ]; then
            echo "❌ Potential secrets found in codebase!"
            exit 1
          else
            echo "✅ No obvious secrets detected"
          fi

      - name: Validate secure headers
        run: |
          echo "🛡️ Validating security headers configuration..."
          if [ -f "_headers" ]; then
            # Check for essential security headers
            HEADERS_OK=true

            if ! grep -q "X-Frame-Options" _headers; then
              echo "⚠️ Missing X-Frame-Options header"
              HEADERS_OK=false
            fi

            if ! grep -q "Content-Security-Policy" _headers; then
              echo "⚠️ Missing Content-Security-Policy header"
              HEADERS_OK=false
            fi

            if [ "$HEADERS_OK" = true ]; then
              echo "✅ Security headers configuration looks good"
            else
              echo "⚠️ Consider adding missing security headers"
            fi
          else
            echo "⚠️ No _headers file found"
          fi

      - name: Check dependencies for known vulnerabilities
        run: |
          echo "📦 Checking dependencies..."
          # List outdated packages
          npm outdated || echo "Some packages may be outdated"

          # Check for deprecated packages
          npm ls --depth=0 | grep WARN || echo "✅ No deprecated package warnings"
