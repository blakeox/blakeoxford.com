name: Comprehensive CI

# This workflow runs the full test suite on main branch and provides complete coverage
on:
  push:
    branches: [main]
  schedule:
    # Run comprehensive tests weekly on Sunday at 2 AM UTC (reduced from nightly)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual triggering for comprehensive testing

# Add permissions for the workflow
permissions:
  contents: write
  pull-requests: write
  checks: write

# Cancel in-progress runs for the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprehensive-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false  # Continue other tests even if one fails
      matrix:
        test-group: [unit, e2e, performance]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: matrix.test-group == 'e2e' || matrix.test-group == 'performance'
        run: |
          echo "Installing Playwright browsers..."
          pnpm exec playwright install --with-deps
          echo "Verifying browser installations..."
          node scripts/build/check-playwright-browsers.cjs || echo "Some browsers may not be available"

      - name: Run linting
        if: matrix.test-group == 'unit'
        run: pnpm run lint

      - name: Run TypeScript check
        if: matrix.test-group == 'unit'
        run: pnpm run typecheck

      - name: Build the application
        run: pnpm run build

      - name: Run deployment readiness check
        if: matrix.test-group == 'unit'
        run: ./scripts/build/deployment-check.sh

      - name: Validate critical CSS implementation
        if: matrix.test-group == 'performance'
        run: |
          echo "🎨 Validating critical CSS inlining..."
          if ! grep -r "critical-css" dist/ > /dev/null 2>&1; then
            echo "⚠️ Warning: No critical CSS detected in build output"
          else
            echo "✅ Critical CSS validation passed"
          fi

      - name: Run unit tests with coverage
        if: matrix.test-group == 'unit'
        run: pnpm run test:coverage

      - name: Run comprehensive E2E tests
        if: matrix.test-group == 'e2e'
        run: |
          echo "Running comprehensive E2E tests with browser fallback..."
          # First try running all browsers
          if pnpm exec playwright test --reporter=line; then
            echo "✅ All browser tests passed"
          else
            echo "⚠️ Some browser tests failed, trying Chromium only..."
            # Fallback to Chromium only
            COMPREHENSIVE_TESTS=false pnpm exec playwright test --project=chromium --reporter=line
          fi
        env:
          COMPREHENSIVE_TESTS: "true"

      - name: Run performance tests
        if: matrix.test-group == 'performance'
        run: pnpm perf:test

      - name: Validate Astro SSG principles
        if: matrix.test-group == 'performance'
        run: |
          echo "🚀 Validating Astro static site generation..."
          
          # Check for hydration directives (should be minimal)
          HYDRATION_COUNT=$(grep -r "client:" src/ | wc -l || echo "0")
          echo "Client-side hydration directives found: $HYDRATION_COUNT"
          
          # Check for proper image optimization
          if [ -d "dist/_astro" ]; then
            echo "✅ Astro asset optimization detected"
          else
            echo "⚠️ Warning: Astro asset optimization may not be working"
          fi
          
          # Verify static output
          if [ -f "dist/index.html" ]; then
            echo "✅ Static HTML generation confirmed"
          else
            echo "❌ Static HTML generation failed"
            exit 1
          fi

      - name: Run Lighthouse CI (essential pages only)
        if: matrix.test-group == 'performance'
        run: pnpm lh:ci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true

      - name: Upload coverage report
        if: matrix.test-group == 'unit'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload test results
        if: always() && matrix.test-group == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload performance reports
        if: always() && matrix.test-group == 'performance'
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports-${{ github.sha }}
          path: lighthouse-reports/
          retention-days: 14

      - name: Run visual regression tests
        if: matrix.test-group == 'e2e'
        run: pnpm test:e2e:visual:ci

  optimization-tasks:
    name: Optimization Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: comprehensive-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run advanced optimizations
        run: pnpm optimize:advanced

      - name: Validate Cloudflare Functions
        run: |
          echo "☁️ Validating Cloudflare Edge Functions..."
          if [ -f "functions/edge-computing.js" ] && [ -f "functions/send-email.js" ]; then
            echo "✅ Edge functions found and ready for deployment"
            # Basic syntax check
            node -c functions/edge-computing.js
            node -c functions/send-email.js
            echo "✅ Edge functions syntax validation passed"
          else
            echo "⚠️ Warning: Some edge functions may be missing"
          fi

      - name: Commit optimized assets
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: '🚀 Automated optimizations [skip ci]'
          file_pattern: 'public/assets/images/** src/assets/**'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}