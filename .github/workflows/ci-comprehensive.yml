name: Comprehensive CI

# This workflow runs the full test suite on main branch and provides complete coverage
on:
  push:
    branches: [main]
  schedule:
    # Run comprehensive tests weekly on Sunday at 2 AM UTC (reduced from nightly)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual triggering for comprehensive testing

# Add permissions for the workflow
permissions:
  contents: write
  pull-requests: write
  checks: write

# Cancel in-progress runs for the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprehensive-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run linting
        run: pnpm run lint

      - name: Run TypeScript check
        run: pnpm run typecheck

      - name: Build the application
        run: pnpm run build

      - name: Run deployment readiness check
        run: ./scripts/build/deployment-check.sh

      - name: Validate critical CSS implementation
        run: |
          echo "🎨 Validating critical CSS inlining..."
          if ! grep -r "critical-css" dist/ > /dev/null 2>&1; then
            echo "⚠️ Warning: No critical CSS detected in build output"
          else
            echo "✅ Critical CSS validation passed"
          fi

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Run comprehensive E2E tests
        run: pnpm exec playwright test
        env:
          COMPREHENSIVE_TESTS: "true"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-playwright-report
          path: playwright-report/
          retention-days: 30

  performance-suite:
    name: Performance Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: comprehensive-tests # Only run if tests pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Run performance tests
        run: pnpm perf:test

      - name: Validate Astro SSG principles
        run: |
          echo "🚀 Validating Astro static site generation..."
          
          # Check for hydration directives (should be minimal)
          HYDRATION_COUNT=$(grep -r "client:" src/ | wc -l || echo "0")
          echo "Client-side hydration directives found: $HYDRATION_COUNT"
          
          # Check for proper image optimization
          if [ -d "dist/_astro" ]; then
            echo "✅ Astro asset optimization detected"
          else
            echo "⚠️ Warning: Astro asset optimization may not be working"
          fi
          
          # Verify static output
          if [ -f "dist/index.html" ]; then
            echo "✅ Static HTML generation confirmed"
          else
            echo "❌ Static HTML generation failed"
            exit 1
          fi

      - name: Run Lighthouse CI (essential pages only)
        run: pnpm lh:ci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || '' }}
        continue-on-error: true

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports-${{ github.sha }}
          path: lighthouse-reports/
          retention-days: 14  # Reduced from 30 days

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis-${{ github.sha }}
          path: bundle-analysis.json
          retention-days: 30

  optimization-tasks:
    name: Optimization Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Reduced from 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event_name != 'schedule'  # Skip on scheduled runs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run advanced optimizations
        run: pnpm optimize:advanced

      - name: Validate Cloudflare Functions
        run: |
          echo "☁️ Validating Cloudflare Edge Functions..."
          if [ -f "functions/edge-computing.js" ] && [ -f "functions/send-email.js" ]; then
            echo "✅ Edge functions found and ready for deployment"
            # Basic syntax check
            node -c functions/edge-computing.js
            node -c functions/send-email.js
            echo "✅ Edge functions syntax validation passed"
          else
            echo "⚠️ Warning: Some edge functions may be missing"
          fi

      - name: Commit optimized assets
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: '🚀 Automated optimizations [skip ci]'
          file_pattern: 'public/assets/images/** src/assets/**'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}