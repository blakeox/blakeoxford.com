name: Comprehensive CI

# This workflow runs the full test suite on main branch and provides complete coverage
on:
  push:
    branches: [main]
  workflow_dispatch:
    # Allow manual triggering for comprehensive testing

# Read-only validation; publishing/deployment is a separate controlled workflow.
permissions:
  contents: read

# Cancel in-progress runs for the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Global flakiness thresholds (stricter for comprehensive runs)
  FLAKINESS_MAX_CURRENT_FLAKY: 0
  FLAKINESS_MAX_RETRY_INTENSITY: 0.03
  FLAKINESS_STRICT: ''

jobs:
  comprehensive-tests:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # Continue other tests even if one fails
      matrix:
        test-group: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["unit","e2e","performance"]' || '["unit","e2e"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate IndexNow ownership contract
        if: matrix.test-group == 'unit'
        run: pnpm quality:indexnow

      - name: Install Playwright browsers with enhanced fallback
        if: matrix.test-group == 'e2e' || matrix.test-group == 'performance'
        run: |
          echo "🎭 Installing Playwright browsers with intelligent fallback..."

          # Try installing all browsers first
          if pnpm exec playwright install; then
            echo "✅ All browsers installed successfully"
          else
            echo "⚠️ Full browser installation failed, installing Chromium only..."
            pnpm exec playwright install chromium || echo "Chromium installation completed with warnings"
            echo "BROWSER_INSTALL_FAILED=true" >> $GITHUB_ENV
            echo "PLAYWRIGHT_BROWSERS_LIMITED=true" >> $GITHUB_ENV
          fi

      - name: Run linting
        if: matrix.test-group == 'unit'
        run: pnpm run lint

      - name: Check formatting (Prettier + Tailwind class sort)
        if: matrix.test-group == 'unit'
        run: pnpm format:check

      - name: Design lint (tokens & spacing)
        if: matrix.test-group == 'unit'
        run: pnpm design:lint

      - name: Run TypeScript check
        if: matrix.test-group == 'unit'
        run: pnpm run typecheck

      - name: Build the application
        run: pnpm run build

      - name: Validate emitted SEO contract
        if: matrix.test-group == 'unit'
        run: pnpm quality:seo

      - name: Run deployment readiness check
        if: matrix.test-group == 'unit'
        run: ./scripts/build/deployment-check.sh

      - name: Run unit tests with coverage
        if: matrix.test-group == 'unit'
        run: pnpm run test:coverage

      - name: Generate quality summary
        if: matrix.test-group == 'unit'
        run: pnpm quality:summary || true # non-blocking

      - name: Generate quality badges
        if: matrix.test-group == 'unit'
        run: pnpm quality:badges || true

      - name: Upload quality badges
        if: always() && matrix.test-group == 'unit'
        uses: actions/upload-artifact@v6
        with:
          name: quality-badges-${{ github.sha }}
          path: badges/
          retention-days: 30

      - name: Upload quality summary
        if: always() && matrix.test-group == 'unit'
        uses: actions/upload-artifact@v6
        with:
          name: quality-summary-${{ github.sha }}
          path: quality-summary.md
          retention-days: 30

      - name: Run E2E tests (optimized, Chromium only on Linux)
        if: matrix.test-group == 'e2e'
        run: |
          echo "🧪 Running optimized essential E2E tests..."
          ./scripts/ci/run-essential-tests.sh

      - name: Run nav visual baselines (Chromium)
        if: matrix.test-group == 'e2e'
        run: pnpm run test:e2e:visual:chromium

      - name: Run performance tests
        if: matrix.test-group == 'performance'
        run: pnpm perf:test

      - name: Validate Astro SSG principles
        if: matrix.test-group == 'performance'
        run: |
          echo "🚀 Validating Astro static site generation..."

          # Check for hydration directives (should be minimal)
          HYDRATION_COUNT=$(grep -r "client:" src/ | wc -l || echo "0")
          echo "Client-side hydration directives found: $HYDRATION_COUNT"

          # Check for proper image optimization
          if [ -d "dist/_astro" ]; then
            echo "✅ Astro asset optimization detected"
          else
            echo "⚠️ Warning: Astro asset optimization may not be working"
          fi

          # Verify static output
          if [ -f "dist/index.html" ]; then
            echo "✅ Static HTML generation confirmed"
          else
            echo "❌ Static HTML generation failed"
            exit 1
          fi

      - name: Start dev server for Lighthouse CI
        if: matrix.test-group == 'performance'
        run: |
          echo "🚀 Starting dev server for Lighthouse CI..."
          pnpm dev &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          timeout 60 bash -c 'until curl -f http://localhost:4321/ > /dev/null 2>&1; do sleep 2; done' || (echo "Server failed to start" && kill $SERVER_PID && exit 1)
          echo "✅ Dev server ready on http://localhost:4321/"

      - name: Run Lighthouse CI (essential pages only)
        if: matrix.test-group == 'performance'
        run: pnpm lh:ci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Stop dev server
        if: always() && matrix.test-group == 'performance'
        run: |
          if [ -n "$SERVER_PID" ]; then
            echo "🛑 Stopping dev server (PID: $SERVER_PID)..."
            kill $SERVER_PID || true
            echo "✅ Dev server stopped"
          fi

      - name: Upload coverage report
        if: matrix.test-group == 'unit'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload test results
        if: always() && matrix.test-group == 'e2e'
        uses: actions/upload-artifact@v6
        with:
          name: comprehensive-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Track flakiness (JSON)
        if: always() && matrix.test-group == 'e2e'
        run: pnpm flakiness:track || true

      - name: Upload flakiness history
        if: always() && matrix.test-group == 'e2e'
        uses: actions/upload-artifact@v6
        with:
          name: flakiness-history-${{ github.sha }}
          path: flakiness-history.json
          retention-days: 30

      - name: Enforce flakiness thresholds (E2E)
        if: always() && matrix.test-group == 'e2e'
        run: |
          if [ -f flakiness-history.json ]; then
            pnpm flakiness:check || exit 1
          else
            echo "No flakiness history found; skipping flakiness:check"
          fi

      - name: Upload performance reports
        if: always() && matrix.test-group == 'performance'
        uses: actions/upload-artifact@v6
        with:
          name: performance-reports-${{ github.sha }}
          path: lighthouse-reports/
          retention-days: 14

  optimization-tasks:
    name: Optimization Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: comprehensive-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run advanced optimizations
        run: pnpm optimize:images

      - name: Snapshot quality baseline (main only)
        run: pnpm quality:snapshot || true
        if: github.ref == 'refs/heads/main'

      - name: Commit quality snapshot index (if changed)
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet quality-snapshots/INDEX.md; then
            echo "No snapshot index changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quality-snapshots/INDEX.md
            git commit -m "chore(ci): update quality snapshot index [skip ci]" || true
            git push || echo "Snapshot push race condition; safe to ignore"
          fi

      - name: Validate Cloudflare Functions
        run: |
          echo "☁️ Validating Cloudflare Edge Functions..."
          if [ -f "functions/index.ts" ] && [ -f "functions/send-email.ts" ]; then
            echo "✅ Edge functions found and ready for deployment"
            # TypeScript entry is validated by the typecheck / wrangler bundle step
            echo "✅ Edge functions present (functions/index.ts)"
          else
            echo "⚠️ Warning: Some edge functions may be missing"
          fi

      - name: Commit optimized assets
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '🚀 Automated optimizations [skip ci]'
          file_pattern: 'public/assets/images/** src/assets/**'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
