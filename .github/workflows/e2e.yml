name: Legacy E2E Tests (Deprecated)

# This workflow is being phased out in favor of ci-fast.yml and ci-comprehensive.yml
# Only runs on explicit request to avoid conflicts
on:
  workflow_dispatch:
    inputs:
      run_legacy_e2e:
        description: 'Run legacy E2E tests'
        required: true
        default: 'false'
        type: boolean

jobs:
  e2e-test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.run_legacy_e2e == 'true'
    steps:
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build the application
        run: pnpm run build

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          COMPREHENSIVE_TESTS: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-playwright-report
          path: playwright-report/
          retention-days: 30
