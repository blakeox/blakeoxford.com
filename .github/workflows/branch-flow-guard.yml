name: Branch Flow Guard

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]

jobs:
  guard:
    name: Enforce Branch Flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR source/target
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref; // target branch
            const head = pr.head.ref; // source branch
            const author = pr.user?.login || '';

            // Allow Dependabot and GitHub Actions automation
            const isDependabot = author === 'dependabot[bot]' || author === 'github-actions[bot]';
            if (isDependabot) {
              core.info('Dependabot/automation PR detected; skipping branch flow checks.');
              return;
            }

            const toDev = base === 'development';
            const toTesting = base === 'testing';
            const toMain = base === 'main';

            const headLower = head.toLowerCase();
            const isFeature = /^(feat|feature|fix|bugfix|chore|docs|test|refactor|perf|ci|build|style)\//.test(headLower);
            const isSprint = /^sprint\//.test(headLower);
            const isHotfix = /^hotfix\//.test(headLower);
            const isCursorAgent = /^cursor\//.test(headLower);
            const isDev = head === 'development';
            const isTesting = head === 'testing';
            const isMain = head === 'main';

            let allowed = false;
            let rule = '';

            // Allowed flows
            if ((isFeature || isSprint || isCursorAgent) && toDev) { allowed = true; rule = 'feature/sprint/cursor -> development'; }
            else if (isDev && toTesting) { allowed = true; rule = 'development -> testing'; }
            else if (isTesting && toMain) { allowed = true; rule = 'testing -> main'; }
            else if (isHotfix && toMain) { allowed = true; rule = 'hotfix/* -> main'; }
            else if (isMain && (toDev || toTesting) && pr.head.repo.fork === false) { allowed = true; rule = 'main -> development/testing (back-merge)'; }

            if (!allowed) {
              core.setFailed(`Invalid branch flow: '${head}' -> '${base}'.\nAllowed flows:\n- feature/*, sprint/*, or cursor/* -> development\n- development -> testing\n- testing -> main\n- hotfix/* -> main\n- main -> development or testing (back-merge after ship)\n`);
            } else {
              core.info(`Branch flow OK (${rule}): '${head}' -> '${base}'.`);
            }