name: Reusable CI Setup

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '24'
    outputs:
      install-cache-hit:
        description: 'Whether the pnpm install cache was hit'
        value: ${{ jobs.setup.outputs.install-cache-hit }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  setup:
    name: Setup Environment
    if: |
      github.actor != 'dependabot[bot]' &&
      (
        ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') &&
          (github.actor == github.repository_owner ||
            contains(fromJSON('["github-actions[bot]","cursor[bot]"]'), github.actor)))
      )
    runs-on: [self-hosted, nuc, seo]
    env:
      PATH: /home/github-runner/.local/node-v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    outputs:
      install-cache-hit: ${{ steps.install.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          dest: ${{ runner.temp }}/pnpm-tooling

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
