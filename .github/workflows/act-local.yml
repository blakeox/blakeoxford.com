name: Act Local Testing

# This workflow is optimized for local testing with act
# It handles the preview server startup more reliably for local development

on:
  push:
  workflow_dispatch:

jobs:
  local-test:
    name: Local E2E Test Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable Service Worker to prevent PWA update popups
        run: |
          echo "Disabling service worker for testing..."
          rm -f public/sw.js

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build the application
        run: pnpm run build

      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          CI: true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
