name: Act Local Testing

# Optimized for local testing with act — manual dispatch only (no push trigger on shared NUC).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH: /home/github-runner/.local/node-v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  local-test:
    name: Local E2E Test Debug
    runs-on: [self-hosted, nuc, seo]
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --user 1001:1001
    env:
      ACT: true
      CI: true
      BROWSER_INSTALL_FAILED: true
      PLAYWRIGHT_BROWSERS_LIMITED: true
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      TZ: UTC
      LANG: C.UTF-8
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable Service Worker to prevent PWA update popups
        run: |
          echo "Disabling service worker for testing..."
          rm -f public/sw.js

      - name: Verify Playwright environment
        run: |
          pnpm exec playwright --version
          node scripts/build/check-playwright-browsers.cjs || true

      - name: Build the application
        run: pnpm run build

      - name: Run Essential E2E tests (Chromium)
        run: pnpm run test:e2e:essential:chromium
        env:
          CI: true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
