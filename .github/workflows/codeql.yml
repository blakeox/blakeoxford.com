name: CodeQL (custom disabled-by-default)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true



jobs:
  analyze:
    name: CodeQL/Analyze
    # Only run this custom CodeQL when explicitly enabled via repo variable.
    # Default GitHub "Code scanning default setup" is enabled on this repo,
    # and running both causes: "advanced configurations cannot be processed when default setup is enabled".
    # Self-hosted: requires CodeQL CLI/bundle on automation-nuc; may fail if the runner lacks CodeQL tooling.
    if: ${{ vars.USE_CUSTOM_CODEQL == 'true' }}
    runs-on: [self-hosted, nuc, seo]
    timeout-minutes: 30
    env:
      PATH: /home/github-runner/.local/node-v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'actions' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: '/language:${{matrix.language}}'
