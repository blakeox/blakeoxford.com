name: Deploy Worker

# Manual Wrangler backup only. Primary production deploys come from
# Cloudflare Workers Builds (Git integration). Do not soft-fail: if you run
# this workflow, a failed deploy must fail the job.
# Token setup: CLOUDFLARE_API_TOKEN='…' ./scripts/setup/github-cloudflare-deploy.sh

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          GIT_COMMIT: ${{ github.sha }}
          PUBLIC_CLARITY_PROJECT_ID: tqngpokfgs
        run: pnpm build

      - name: Verify analytics activation contract
        env:
          PUBLIC_CLARITY_PROJECT_ID: tqngpokfgs
        run: pnpm quality:analytics -- --require-clarity

      - name: Validate Worker configuration
        run: pnpm exec wrangler deploy --dry-run

      - name: Refresh Vectorize index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm vectorize:index
          pnpm exec wrangler vectorize upsert blakeoxford-content --file=vectorize-data.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var GIT_COMMIT:${{ github.sha }} --message commit:${{ github.sha }}

      - name: Verify deployed provenance
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/blakeoxford-com/deployments")
          EXPECTED_COMMIT="$EXPECTED_COMMIT" RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ['RESPONSE'])
          deployments = payload.get('result', {}).get('deployments', [])
          expected = f"commit:{os.environ['EXPECTED_COMMIT']}"
          active = deployments[0] if deployments else {}
          message = active.get('annotations', {}).get('workers/message', '')
          if message != expected:
              print(f"❌ Active deployment message {message!r} does not match {expected!r}")
              sys.exit(1)
          print(f"✅ Cloudflare reports the active deployment for {os.environ['EXPECTED_COMMIT']}")
          PY

  seo-monitor:
    name: Verify deployed SEO and redirect contract (NUC)
    needs: deploy
    runs-on: [self-hosted, linux, x64, nuc, seo]
    timeout-minutes: 15
    env:
      # The automation NUC intentionally exposes the pinned Node runtime only
      # to trusted repository workflows; this smoke does not receive secrets.
      PATH: /home/github-runner/.local/node-v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify deployed SEO and redirect contract
        env:
          EDGE_EXPECTED_COMMIT: ${{ github.sha }}
        run: bash scripts/monitor/seo-edge-smoke.sh
