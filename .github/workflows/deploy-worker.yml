name: Deploy Worker

# Manual Wrangler backup only. Primary production deploys come from
# Cloudflare Workers Builds (Git integration). Do not soft-fail: if you run
# this workflow, a failed deploy must fail the job.
# Token setup: CLOUDFLARE_API_TOKEN='…' ./scripts/setup/github-cloudflare-deploy.sh

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          GIT_COMMIT: ${{ github.sha }}
          PUBLIC_CLARITY_PROJECT_ID: tqngpokfgs
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ secrets.PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
        run: pnpm build

      - name: Validate Worker configuration
        run: pnpm exec wrangler deploy --dry-run

      - name: Refresh Vectorize index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm vectorize:index
          pnpm exec wrangler vectorize upsert blakeoxford-content --file=vectorize-data.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var GIT_COMMIT:${{ github.sha }}

      - name: Verify deployed provenance
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --retry 10 --retry-delay 3 https://blakeoxford.com/__version)
          deployed=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")')
          if [ "$deployed" != "$EXPECTED_COMMIT" ]; then
            echo "❌ Deployed commit $deployed does not match $EXPECTED_COMMIT"
            exit 1
          fi
          echo "✅ Production reports the intended commit $deployed"

      - name: Verify deployed SEO and redirect contract
        env:
          EDGE_EXPECTED_COMMIT: ${{ github.sha }}
        run: pnpm monitor:seo
