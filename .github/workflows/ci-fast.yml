name: Fast CI

# This workflow provides quick feedback for PRs with essential checks only
on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
      - "assets-source/**"

jobs:
  # Quick validation that code builds and basic tests pass
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Build the application
        run: pnpm run build

      - name: Run unit tests
        run: pnpm test

  # Essential E2E tests - just the critical user paths
  essential-e2e:
    name: Essential E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build the application
        run: pnpm run build

      - name: Run essential Playwright tests
        run: pnpm exec playwright test tests/playwright/navigation-essential.spec.ts tests/playwright/accessibility-basic.spec.ts tests/playwright/performance-smoke.spec.ts
        env:
          COMPREHENSIVE_TESTS: "false"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-playwright-report
          path: playwright-report/
          retention-days: 7

  # Basic accessibility check
  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build the application
        run: pnpm run build

      - name: Run basic accessibility tests
        run: pnpm exec playwright test tests/playwright/accessibility-basic.spec.ts
        env:
          COMPREHENSIVE_TESTS: "false"
        continue-on-error: true