name: Fast CI

# This workflow provides quick feedback for PRs with essential checks only
on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
      - "assets-source/**"
      - "lighthouse-reports/**"
      - "optimization-reports/**"
      - "coverage/**"

# Explicit token permissions: default org policy is read-only; we need write to comment on PRs
permissions:
  contents: read
  pull-requests: write
  issues: write

# Cancel in-progress runs for the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flakiness thresholds (adjust as project stabilizes)
  FLAKINESS_MAX_CURRENT_FLAKY: 0
  FLAKINESS_MAX_RETRY_INTENSITY: 0.05
  # Set to 1 later if you want absence of history to fail early
  FLAKINESS_STRICT: ''

jobs:
  # Quick validation that code builds and basic tests pass
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Astro build
        uses: actions/cache@v6
        with:
          path: |
            .astro/
            dist/
            node_modules/.astro/
          key: astro-build-${{ runner.os }}-${{ hashFiles('src/**/*', 'public/**/*', 'astro.config.mjs') }}
          restore-keys: |
            astro-build-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency audit (fail on high)
        run: pnpm security:audit -- --audit-level=high

      - name: Run ESLint
        run: pnpm run lint

      - name: Check formatting (Prettier + Tailwind class sort)
        run: pnpm format:check

      - name: Design lint (tokens & spacing)
        run: pnpm design:lint

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      - name: Validate Zaraz analytics template
        run: pnpm run validate:zaraz

      - name: Build the application
        run: pnpm run build

      - name: Run performance budget validation
        run: ./scripts/build/performance-budget.sh

      - name: Check for performance regressions
        run: ./scripts/build/performance-regression.sh

      - name: Security headers static check
        run: pnpm security:headers || exit 1

      - name: Prohibit raw waitForTimeout usage
        run: pnpm quality:timeouts

      - name: Run unit tests
        run: pnpm test -- --run

      - name: Generate quality summary
        run: pnpm quality:summary || true # summary generation should never fail pipeline

      - name: Generate quality badges
        run: pnpm quality:badges || true

      - name: Upload quality badges
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-badges
          path: badges/
          retention-days: 14

      - name: Upload quality summary artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-summary
          path: quality-summary.md
          retention-days: 14



  # Essential E2E tests - just the critical user paths
  essential-e2e:
    name: Essential E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quick-validation # Wait for basic validation to pass first
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright dependencies
        run: |
          echo "🎭 Installing Playwright system dependencies..."
          # Install system dependencies for browsers, but don't download browsers
          sudo npx playwright install-deps
          echo "✅ System dependencies installed"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - name: Install Playwright browsers (full with Chromium fallback)
        run: |
          echo "Attempting full Playwright browser install (chromium, firefox, webkit)..."
          if pnpm exec playwright install; then
            echo "✅ Playwright browsers installed"
            echo "PLAYWRIGHT_BROWSERS_LIMITED=false" >> $GITHUB_ENV
          else
            echo "⚠️ Full Playwright install failed; falling back to Chromium-only"
            pnpm exec playwright install chromium
            echo "PLAYWRIGHT_BROWSERS_LIMITED=true" >> $GITHUB_ENV
          fi

      - name: Build the application
        run: pnpm run build

      - name: Run runtime quality gate (search/a11y/long-tasks)
        run: pnpm quality:runtime
        env:
          MIN_TOPN_PASS_RATE: "80"
          A11Y_FAIL: "true"
          SEARCH_TOP_N: "3"
          A11Y_MAX_PER_ROUTE: "2"
          DEADLINK_FAIL: "true"

      - name: Upload runtime quality artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-quality-artifacts
          path: |
            search-relevance-results.json
            accessibility-history.json
            long-tasks-report.json
            quality-snapshots/
            dead-links-report.json
          retention-days: 14

      - name: Run essential Playwright tests (Chromium only)
        run: pnpm run test:e2e:essential:chromium
        env:
          COMPREHENSIVE_TESTS: "false"

      - name: Run nav visual baselines (Chromium)
        run: pnpm run test:e2e:visual:chromium

      - name: Runtime contrast audit (Playwright)
        run: pnpm audit:contrast

      - name: Track flakiness (Playwright JSON)
        if: always()
        run: pnpm flakiness:track || true

      - name: Upload flakiness history
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flakiness-history
          path: flakiness-history.json
          retention-days: 14

      - name: Enforce flakiness thresholds (optional)
        if: always()
        run: |
          if [ -f flakiness-history.json ]; then
            pnpm flakiness:check || exit 1
          else
            echo "No flakiness history present; skipping flakiness:check"
          fi

      - name: Verify accessibility standards
        run: |
          echo "♿ Checking accessibility compliance..."
          # Check for proper ARIA attributes in built HTML
          if grep -r "aria-" dist/ --include="*.html" > /dev/null; then
            echo "✅ ARIA attributes found in build"
          else
            echo "⚠️ Warning: Limited ARIA attributes detected"
          fi
          # Require an alt attribute on every <img>. Accept alt="", alt='', or boolean alt
          # (Astro historically collapses empty alt="" to bare alt).
          ALT_MISSING=$(
            grep -rohE '<img\b[^>]*>' dist --include='*.html' \
              | grep -vE '\balt(=|\s|/|>)' \
              | wc -l \
              | tr -d ' '
          )
          if [ "${ALT_MISSING:-0}" -gt 0 ]; then
            echo "❌ Found $ALT_MISSING images without alt attributes in HTML files"
            grep -rohE '<img\b[^>]*>' dist --include='*.html' | grep -vE '\balt(=|\s|/|>)' || true
            exit 1
          else
            echo "✅ All images have alt attributes"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: essential-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Regenerate quality badges (post-runtime)
        if: always()
        run: pnpm quality:badges || true

      - name: Upload quality badges (post-runtime)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-badges-post-runtime
          path: badges/
          retention-days: 14

  # Cross-browser essential E2E (Firefox + WebKit) on macOS to keep Linux fast
  essential-e2e-crossbrowser:
    name: Essential E2E (Firefox/WebKit on macOS)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 20
    needs: quick-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers (macOS)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - name: Install Firefox and WebKit browsers
        run: pnpm exec playwright install firefox webkit

      - name: Build the application
        run: pnpm run build

      - name: Run essential tests on Firefox/WebKit
        run: pnpm exec playwright test --grep="@essential" --project=firefox --project=webkit
        env:
          COMPREHENSIVE_TESTS: "false"
          PLAYWRIGHT_OPTIONAL_BROWSERS: "true"

      - name: Track flakiness (Playwright JSON)
        if: always()
        run: pnpm flakiness:track || true

      - name: Upload flakiness history (macOS)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flakiness-history-macos
          path: flakiness-history.json
          retention-days: 14

      - name: Upload cross-browser report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: essential-playwright-report-macos
          path: playwright-report/
          retention-days: 7

      - name: Enforce flakiness thresholds (macOS optional)
        if: always()
        run: |
          if [ -f flakiness-history.json ]; then
            pnpm flakiness:check || true
          else
            echo "No flakiness history present; skipping flakiness:check"
          fi

  post-quality-comment:
    name: Post PR Quality Summary
    runs-on: ubuntu-latest
    needs: [quick-validation, essential-e2e, essential-e2e-crossbrowser]
    # Cross-browser E2E is PR-skipped; always() + result checks keep this job runnable.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false &&
      needs.quick-validation.result == 'success' &&
      needs.essential-e2e.result == 'success' &&
      (needs.essential-e2e-crossbrowser.result == 'success' || needs.essential-e2e-crossbrowser.result == 'skipped')
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download quality summary
        uses: actions/download-artifact@v6
        with:
          name: quality-summary
          path: ./artifacts
      - name: Download runtime quality artifacts
        uses: actions/download-artifact@v6
        with:
          name: runtime-quality-artifacts
          path: ./artifacts
      - name: Download Linux essential E2E report
        uses: actions/download-artifact@v6
        with:
          name: essential-playwright-report
          path: ./artifacts/linux
        continue-on-error: true
      - name: Download macOS essential E2E report
        uses: actions/download-artifact@v6
        with:
          name: essential-playwright-report-macos
          path: ./artifacts/macos
        continue-on-error: true
      - name: Post / Update PR Quality Summary Comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const prNumber = context.payload.pull_request.number;
            const header = '<!-- quality-summary -->';

            // Base body from quality-summary.md
            let body = 'Quality summary not generated';
            const summaryPath = path.join('artifacts','quality-summary.md');
            if (fs.existsSync(summaryPath)) {
              body = fs.readFileSync(summaryPath, 'utf-8');
            }

            // Prefer composite score when present
            let badge = '';
            const compositeMatch = body.match(/Composite Score:\s*(\d+(?:\.\d+)?)/);
            if (compositeMatch) {
              const s = parseFloat(compositeMatch[1]);
              let emoji = '✅';
              if (s >= 85) emoji = '💎'; else if (s >= 70) emoji = '✅'; else if (s >= 55) emoji = '⚠️'; else emoji = '❌';
              badge = `${emoji} Reliability composite: ${s}`;
            }

            // A11y totals
            let a11yLine = '';
            try {
              const a11yPath = path.join('artifacts','accessibility-history.json');
              if (fs.existsSync(a11yPath)){
                const hist = JSON.parse(fs.readFileSync(a11yPath,'utf-8'));
                const last = Array.isArray(hist) && hist.length ? hist[hist.length-1] : null;
                if (last){
                  const total = last.totals?.count ?? (Array.isArray(last.pages) ? last.pages.reduce((acc,p)=> acc + (p.violations>0?p.violations:0),0) : 0);
                  a11yLine = `♿ A11y violations (latest): ${total}`;
                }
              }
            } catch {}

            // Search relevance gate
            let searchLine = '';
            try {
              const srPath = path.join('artifacts','search-relevance-results.json');
              if (fs.existsSync(srPath)){
                const sr = JSON.parse(fs.readFileSync(srPath,'utf-8'));
                const status = sr.gatePassed ? '✅' : '❌';
                searchLine = `🔎 Search Top-${sr.topN} pass: ${sr.topNPassRate}% (gate ${sr.minTopNRequired || 0}% ${status})`;
              }
            } catch {}

            // Dead links summary
            let deadLinksLine = '';
            try {
              const dlPath = path.join('artifacts','dead-links-report.json');
              if (fs.existsSync(dlPath)){
                const dl = JSON.parse(fs.readFileSync(dlPath,'utf-8'));
                const status = (dl.dead || 0) === 0 ? '✅' : '❌';
                deadLinksLine = `🔗 Dead links: ${dl.dead}/${dl.total} ${status}`;
              }
            } catch {}

            // Helper to count Playwright test results from JSON reporter
            function summarizePlaywrightReport(jsonPath) {
              if (!fs.existsSync(jsonPath)) return null;
              const data = JSON.parse(fs.readFileSync(jsonPath, 'utf-8'));
              let total = 0, failed = 0, passed = 0, skipped = 0;
              function walkSuite(suite) {
                if (!suite) return;
                if (suite.suites) suite.suites.forEach(walkSuite);
                if (suite.tests) {
                  for (const t of suite.tests) {
                    total += 1;
                    const last = (t.results || []).slice(-1)[0];
                    const status = last?.status || t.outcome || t.status || 'unknown';
                    if (status === 'passed') passed += 1;
                    else if (status === 'skipped' || status === 'timedOut' && (last?.status === 'skipped')) skipped += 1;
                    else failed += 1;
                  }
                }
              }
              if (Array.isArray(data.suites)) data.suites.forEach(walkSuite);
              return { total, passed, failed, skipped };
            }

            // Summaries for Linux (Chromium) and macOS (FF/WebKit)
            let e2eLinuxLine = '';
            let e2eMacLine = '';
            try {
              const linuxJson = path.join('artifacts','linux','playwright-report','test-results.json');
              const macJson = path.join('artifacts','macos','playwright-report','test-results.json');
              const linux = summarizePlaywrightReport(linuxJson);
              const mac = summarizePlaywrightReport(macJson);
              if (linux) {
                const ok = linux.failed === 0 ? '✅' : '❌';
                e2eLinuxLine = `🧪 Essential E2E (Linux • Chromium): ${ok} ${linux.passed}/${linux.total} passed`;
              }
              if (mac) {
                const ok = mac.failed === 0 ? '✅' : '❌';
                e2eMacLine = `🍎 Essential E2E (macOS • FF/WebKit): ${ok} ${mac.passed}/${mac.total} passed`;
              }
            } catch {}

            const lines = [badge, a11yLine, searchLine, deadLinksLine, e2eLinuxLine, e2eMacLine].filter(Boolean).join('\n');
            const finalBody = `${header}\n${lines ? lines + '\n\n' : ''}${body}`;

            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });
              const existing = comments.data.find(c => c.body && c.body.includes(header));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: finalBody
                });
                core.info('Updated existing quality summary comment.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: finalBody
                });
                core.info('Created new quality summary comment.');
              }
            } catch (err) {
              // Do not fail the job if we lack permissions (e.g., GITHUB_TOKEN read-only)
              core.warning(`Skipping PR comment due to error: ${err?.message || err}`);
              core.info('Writing quality summary to step summary instead.');
              core.summary.addRaw(finalBody).write();
            }

  # Single required status check that aggregates fast CI jobs
  required-status-checks:
    name: Required Checks Gate
    runs-on: ubuntu-latest
    # Cross-browser E2E only runs on main/dispatch; treat skipped as OK on PRs.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.quick-validation.result == 'success' &&
      needs.essential-e2e.result == 'success' &&
      (needs.essential-e2e-crossbrowser.result == 'success' || needs.essential-e2e-crossbrowser.result == 'skipped')
    needs: [quick-validation, essential-e2e, essential-e2e-crossbrowser]
    steps:
      - name: All required checks passed
        run: |
          echo "✅ quick-validation (${{ needs.quick-validation.result }})"
          echo "✅ essential-e2e Chromium (${{ needs.essential-e2e.result }})"
          echo "✅ essential-e2e-crossbrowser (${{ needs.essential-e2e-crossbrowser.result }})"
          echo "All required checks are green."

