name: Fast CI

# This workflow provides quick feedback for PRs with essential checks only
on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
      - "assets-source/**"
      - "lighthouse-reports/**"
      - "optimization-reports/**"
      - "coverage/**"

# Cancel in-progress runs for the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick validation that code builds and basic tests pass
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Astro build
        uses: actions/cache@v4
        with:
          path: |
            .astro/
            dist/
            node_modules/.astro/
          key: astro-build-${{ runner.os }}-${{ hashFiles('src/**/*', 'public/**/*', 'astro.config.mjs') }}
          restore-keys: |
            astro-build-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      - name: Build the application
        run: pnpm run build

      - name: Run performance budget validation
        run: ./scripts/build/performance-budget.sh

      - name: Check for performance regressions
        run: ./scripts/build/performance-regression.sh

      - name: Run unit tests
        run: pnpm test -- --run

      - name: Contrast token audit
        run: pnpm audit:contrast # fails only if failing tokens are actually used in build

      - name: Run mutation tests (non-blocking)
        run: pnpm test:mutants
        continue-on-error: true

      - name: Log mutation history (main repo only)
        if: github.repository_owner == 'blakeox'
        run: pnpm mutation:history:log || true

      - name: Generate quality summary
        run: pnpm quality:summary || true # summary generation should never fail pipeline

      - name: Upload quality summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-summary
          path: quality-summary.md
          retention-days: 14

      - name: Post / Update PR Quality Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const core = require('@actions/core');
            const prNumber = context.payload.pull_request.number;
            let body = 'Quality summary not generated';
            if (fs.existsSync('quality-summary.md')) {
              body = fs.readFileSync('quality-summary.md', 'utf-8');
            }
            const header = '<!-- quality-summary -->';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const existing = comments.data.find(c => c.body && c.body.includes(header));
            // Extract mutation score line
            let badge = '';
            const scoreMatch = body.match(/Mutation Score: (\d+(?:\.\d+)?)%/);
            if (scoreMatch) {
              const s = parseFloat(scoreMatch[1]);
              let emoji = '🧬';
              if (s >= 80) emoji = '💎'; else if (s >= 70) emoji = '✅'; else if (s >= 60) emoji = '⚠️'; else emoji = '❌';
              badge = `${emoji} Mutation: ${s}%`;
            }
            const finalBody = `${header}\n${badge ? badge + '\n\n' : ''}${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: finalBody
              });
              core.info('Updated existing quality summary comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: finalBody
              });
              core.info('Created new quality summary comment.');
            }

  # Essential E2E tests - just the critical user paths
  essential-e2e:
    name: Essential E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quick-validation # Wait for basic validation to pass first
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright dependencies
        run: |
          echo "🎭 Installing Playwright system dependencies..."
          # Install system dependencies for browsers, but don't download browsers
          sudo npx playwright install-deps
          echo "✅ System dependencies installed"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - name: Install Chromium browser for Playwright
        run: pnpm exec playwright install chromium

      - name: Configure Chromium-only fallback on Linux CI
        run: |
          echo "Configuring Chromium-only E2E run on Linux CI to avoid WebKit/Firefox deps..."
          echo "BROWSER_INSTALL_FAILED=true" >> $GITHUB_ENV
          echo "PLAYWRIGHT_BROWSERS_LIMITED=true" >> $GITHUB_ENV

      - name: Build the application
        run: pnpm run build

      - name: Run essential Playwright tests (Chromium only)
        run: pnpm run test:e2e:essential:chromium
        env:
          COMPREHENSIVE_TESTS: "false"

      - name: Verify accessibility standards
        run: |
          echo "♿ Checking accessibility compliance..."
          # Check for proper ARIA attributes in built HTML
          if grep -r "aria-" dist/ --include="*.html" > /dev/null; then
            echo "✅ ARIA attributes found in build"
          else
            echo "⚠️ Warning: Limited ARIA attributes detected"
          fi
          # Check for alt attributes in HTML files only (exclude README.md and other docs)
          ALT_MISSING=$(grep -r "<img" dist/ --include="*.html" | grep -v "alt=" | wc -l || echo "0")
          if [ "$ALT_MISSING" -gt 0 ]; then
            echo "❌ Found $ALT_MISSING images without alt attributes in HTML files"
            grep -r "<img" dist/ --include="*.html" | grep -v "alt=" || true
            exit 1
          else
            echo "✅ All images have alt attributes"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-playwright-report
          path: playwright-report/
          retention-days: 7

