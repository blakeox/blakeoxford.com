name: Contrast Maintenance

on:
  schedule:
    - cron: '30 4 * * 1' # weekly after contrast run
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nuc-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


env:
  PATH: /home/github-runner/.local/node-v24.18.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  auto-close:
    runs-on: [self-hosted, nuc, seo]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          dest: ${{ runner.temp }}/pnpm-tooling
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile --prod=false
      - name: Auto-close stable contrast issues
        env:
            CONTRAST_AUTO_CLOSE_DAYS: 3
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/quality/contrast-auto-close.js
