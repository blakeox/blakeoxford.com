name: Edge Availability Monitor

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: edge-availability-monitor
  cancel-in-progress: true

jobs:
  smoke:
    name: Production edge smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify public edge contract
        run: bash scripts/monitor/cloudflare-edge-smoke.sh
